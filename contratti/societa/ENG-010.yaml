# --- CHIUSO il 2026-10-19 con REJECT (2 gate su 2: R1 e R2) ---
# Cosa e' entrato davvero: la formula del sigillo e' UNA e importata (ERR-0059
# CHIUSO, verificato da entrambi i revisori con la revisione reale di ENG-009);
# `close` legge e verifica il registro PRIMA di scrivere; la regola delle due
# evidenze vale anche in verifica; il timbro porta l'impronta del contract
# (fail-closed); un contract non-UTF8 non spegne il controllo dei percorsi;
# il perimetro e' dichiarato (DEC-0064) e il brief lo porta; DRIFT-027 corretto
# (un contract chiuso non possiede piu' i percorsi). 9 difetti su 12 chiusi.
#
# Residui (dentro il perimetro, non dolo) -> backlog ERR-0060:
#   D1 il brief non e' difeso: `evidenze/incognite.yaml` non-UTF8 o con `unknowns`
#      malformato -> traceback; drift/errori non-UTF8 -> letti in silenzio (0 su 0).
#      E' la classe "un validatore che si rompe" applicata al brief.
#   D2 un registro che non conosce la revisione in corso (ledger con R1, revisione
#      R2 aperta) lascia chiudere e registra su R1; il freeze successivo ricicla "R2".
#   D3 il test __pycache__ non prova l'esclusione (rimuoverla lascia 115 PASS).
#   D4 la suite del kit non e' ermetica: legge `evidenze/ENG-009-revisione.yaml` reale.
#
# Perche' chiuso adesso: budget esaurito (2/2) e decisione del CEO di non spendere
# altri giri sul kit prima dell'MVP. I quattro residui non bloccano l'uso e sono
# nel backlog; il kit fa bene cio' che il perimetro dichiara.
