# Contract operativo GOV-004 — raggi STRETTI: i file, non le cartelle

task_id: GOV-004
title: "I rapporti di passo si controllano, e il lavoro fatto si vede da fuori"
domain: technical
agent: platform
task_type: shared_platform
product: altro
decision_record: DECISIONI/DEC-0054-un-percorso-un-titolare.md

objective: >
  Solo 9 rapporti di passo su 23 seguono il modello, e la sezione che manca di piu' e'
  «cosa passa allo sprint successivo» (11 su 23) — cioe' proprio quella che serve
  all'agente che viene dopo. E un agente non puo' sapere cosa e' stato fatto negli
  altri progetti senza aprire cartella per cartella.

inputs:
  - requirements
  - decision_record

acceptance_criteria:
  - milestone.py check segnala un rapporto che non ha le sei sezioni del modello
  - la sezione «cosa passa allo sprint successivo» e' pretesa come le altre
  - la suite deterministica prova il controllo, con il difetto iniettato
  - stato.py mostra gli ultimi passi chiusi di TUTTI i progetti, senza spostare i documenti
  - i documenti restano nel progetto (invariante 15): si legge, non si copia

constraints:
  - no production access
  - do not edit this contract
  - do not change own permissions
  - RAGGIO STRETTO: i file elencati, non le cartelle. E' la regola 3 di DEC-0054
  - nessun progetto numerato si tocca: i rapporti si LEGGONO

outputs:
  - code
  - tests
  - evidence

required_gates:
  - Code Review

approval:
  human: true

budget:
  max_retries: 2

priority: P0
impact_forecast:
  data: NONE
  schema: NONE
  auth: NONE
  security: NONE
  shared_platform: MED
  product: NONE

status: chiuso
write_scope:
