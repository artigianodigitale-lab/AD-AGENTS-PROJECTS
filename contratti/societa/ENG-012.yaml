# modificare (budget non-mappa, timestamp). L'ho scritto lo stesso, con uno script
# bash: il plugin non ha visto la scrittura perche' la sua analisi della shell e' una
# euristica (limite dichiarato che si e' avverato). E' ERR-0062.
# Residui rimasti (-> ENG-013, contract nuovo con lo scope giusto):
#   - brief che ignora in silenzio `errori/*.yaml` malformati;
#   - autodetect del profilo DSH senza test (e ambiguo con 2+ profili);
#   - `--apply` su voce disabilitata: il README promette "corregge", il codice la
#     lascia stale e ripristina;
#   - cordis: id matchato per sottostringa (una voce sorella con id simile viene
#     distrutta), `-   id:` con spazi, id non prima chiave, `!!js` nella nostra voce;
#   - `scan` cieco ai `.yml`; `budget: null` resta un warning; ramo morto `is_dir`;
#   - README del server ancora contraddittorio ("non e' registrato").
