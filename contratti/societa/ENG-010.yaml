acceptance_criteria:
  - "UNA SOLA implementazione della formula: `tools/ad_contract.py` espone `digest_revisione(dati)` e `digest_chiusura(dati)`; `tests/gate_kit.py` le IMPORTA (nessuna copia). Un test calcola il sigillo di una revisione vera con i due moduli e pretende che coincida"
  - "prova end-to-end della chiusura: in una macchina scratch, `freeze` -> `close` -> contract `status: closed` -> `ad_contract.validate(root=...)` PASS e `scan` pulito; e la revisione R2 reale di ENG-009 (creata prima di questa correzione) viene giudicata valida dal validatore dopo la correzione"
  - "UTF-8 invalido in revisione, contract, timbro o evidenza -> `GateError` con la ragione, mai `UnicodeDecodeError` con traceback"
  - "ruolo dell'evidenza verificato: `close` accetta `<task>-QA.yaml` solo con `gate: QA` (o `producer: qa`) e `<task>-CodeReview.yaml` solo con `gate: Code Review` (o `producer: review`); copiare l'evidenza del QA sopra quella del Code Review NON chiude il gate"
  - "il limite del registro e' DICHIARATO nel README: cancellare `evidenze/.gate-ledger.yaml` fa ripartire il contatore in silenzio (dolo fuori perimetro, DEC-0063); un registro incoerente (vuoto dopo il freeze) fa rifiutare `close`"
  - "coerenza rimessa a posto: `__pycache__` escluso sia al freeze sia al check; contract scelto per `task_id` e rifiuto se due contract hanno lo stesso task; voce vuota del `write_scope` non saltata in silenzio; `subdirs` tipata come `dirs`; `frozen_at` con i microsecondi e confronto stretto; `brief` verifica l'identita' della revisione"
  - "i test nuovi provano: coerenza dei sigilli (kit vs validatore), chiusura end-to-end validata, UTF-8, ruolo delle evidenze, `__pycache__`, contract ombra, registro incoerente"
  - "`tests/test_gate_kit.py` verde; `tests/ci.py --full` verde (compreso `gate-aperto`); suite 99/190/65/47 verdi; `coherence.py` 0; `validate_contract.py` su ENG-009 e ENG-010 PASS"
  - "nessuna dipendenza nuova; nessun file di altri titolari"

