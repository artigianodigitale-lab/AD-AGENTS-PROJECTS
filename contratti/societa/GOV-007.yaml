# Contract operativo GOV-007 — l'engine diventa un prodotto

task_id: GOV-007
title: "L'engine diventa un prodotto: numeri, porta d'ingresso, primo avvio, il CEO come ruolo"
domain: technical
agent: platform
task_type: shared_platform
product: altro
decision_record: DECISIONI/DEC-0054-un-percorso-un-titolare.md

objective: >
  Oggi questa e' l'installazione personale del CEO: «il CEO» e' scritto 63 volte, i
  progetti si numerano per abitudine e non per regola, non c'e' porta d'ingresso, e
  chi collega la cartella non ottiene niente. Il CEO ha descritto il prodotto: un utente
  collega la cartella, l'AI chiede il nome, chiede il permesso di scaricare cio' che
  serve, e da li' si lavora. Questo contract lo rende vero.

inputs:
  - requirements
  - decision_record

acceptance_criteria:
  - una cartella di progetto SENZA numero viene RIFIUTATA, e il rifiuto dice quale numero usare
  - la regola dei numeri e' scritta nella costituzione, non solo applicata
  - AGENTS.md esiste nella radice, ed e' la porta d'ingresso che DSH legge da solo
  - se manca sede.yaml, AGENTS.md dice che l'engine non e' avviato e come avviarlo
  - sede.yaml dichiara il nome del CEO; il nome vive in UN posto
  - il primo avvio chiede nome e permesso, installa e PROVA
  - la suite e il plugin provano tutto, con il difetto iniettato

constraints:
  - no production access
  - do not edit this contract
  - do not change own permissions
  - i 17 progetti NON si toccano: si leggono
  - una cartella non numerata si BLOCCA e si spiega (scelta (a) del CEO, 2026-10-13)

