# trovati e 12 chiusi (H1-H3, M1-M4, L1, L4, N1, N2, N5*, N6, N7, i due bloccanti del
# 3o gate). Le evidenze finali sono evidenze/ENG-002-QA.yaml e -CodeReview.yaml
# (outcome FAIL, produttori qa/review).
#
# Perche' REJECT e non un quinto tentativo: il 4o gate ha verificato il
# congelamento (9/9 impronte, revisione immobile — il protocollo di ERR-0057 ha
# funzionato) e ha trovato due residui:
#   1. un percorso con byte NUL -> -32603 con rimedio falso ("riprova") invece di
#      -32602 con la ragione: ValueError sfugge a _resolve, che cattura solo OSError;
#   2. ad_tree.paths accetta [''] (radice) e ['   '] come se fossero percorsi.
# Sono piccoli, ma il budget di gate e' speso e la regola e' che senza ACCEPT non
# si chiude con ACCEPT. La chiusura dei due residui e la registrazione sono in
# **ENG-003** (approvato dal CEO con "A e B, dobbiamo risolvere ogni situazione").
#
# Cosa resta non fatto qui, e dove va: registrazione nei 5 client (ENG-003, bloccata
# da ADMF-008 e GOV-008); riga in tools/README.md (DRIFT-026, ADMF-008).
