# delle incognite era fail-open senza --evidence, e una domanda critical si chiudeva
# con una prova inventata. Riparati tutti (F1-F5) e registrati in
# errori/ERR-0051-regola-solo-col-flag.yaml. Il secondo gate li ha riprodotti e
# verificati chiusi, e ha promosso.
#
# Restano due rilievi NON bloccanti del secondo gate, registrati come aperti e
# rimandati: (a) `--unknown new` scrive una voce con supporting_evidence inesistenti
# e la rifiuta solo al check successivo; (b) test_cli_bundle dipende dallo stato di
# evidenze/incognite.yaml. Non si correggono dentro un contract gia' verificato:
# l'evidenza vale per la revisione che ha visto. -> ERR-0052.
