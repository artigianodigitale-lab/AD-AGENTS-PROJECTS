nota: >
  Numerato 0023 e non 0018 ne' 0019: **entrambi esistevano gia'**, scritti da
  **un'altra sessione** che lavora negli stessi registri nello stesso momento. Il
  controllo dei duplicati li ha presi entrambi — ma **dopo**, non prima. Due sessioni
  possono scegliere lo stesso numero insieme, e niente lo impedisce: nessun blocco,
  nessuna prenotazione.

