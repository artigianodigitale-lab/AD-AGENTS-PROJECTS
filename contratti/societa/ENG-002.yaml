# Perche' i FILE e non `tools/ad_mcp/`: GOV-007 ha imparato che le cartelle creano
# sovrapposizioni («il primo tentativo dichiarava le cartelle, e il validatore l'ha
# preso»). `tools/verdict.py`, `tools/ad_evidence.py` e la suite sono liberi dopo la
# chiusura di ENG-001, e ci vanno i due rilievi di ERR-0052.

