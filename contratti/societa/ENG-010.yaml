product: altro
decision_record: DECISIONI/DEC-0063-il-congelamento-come-difesa-dalla-dimenticanza.md

objective: >
  ENG-009 (due gate, entrambi REJECT) ha lasciato quattro residui, e il piu' grave e'
  ERR-0059: la formula del sigillo della revisione e' scritta in due punti
  (`tests/gate_kit.py` la scrive, `tools/ad_contract.py` la ricalcola) e i due punti
  sono divergiti, cosi' il lucchetto accusa di manomissione le revisioni autentiche e
  blocca la chiusura dei contract. Questo contract porta la formula in UN posto solo
  (in `tools/ad_contract.py`, il kit la importa), chiude gli altri tre residui (UTF-8
  invalido, ruolo dell'evidenza, limite del registro dichiarato) e aggiunge i test che
  avrebbero preso la divergenza: due moduli, stessa revisione, stesso sigillo.

