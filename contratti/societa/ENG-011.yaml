# --- CHIUSO il 2026-10-19 con REJECT (2 gate su 2: R1 e R2) ---
# Cosa FUNZIONA ed e' la ragione d'essere del contract: la registrazione reale e'
# avvenuta su QUATTRO client (DSH profilo desktop, Cursor, Codex, Gemini), il server
# e' collegato in questa sessione (10 strumenti ad_* rispondono), la portabilita' e'
# provata (macchina copiata -> registra se stessa; spostata -> STALE; apply corregge),
# il rollback e' byte-identico, il backup esiste per ogni file preesistente, e la
# registrazione e' additiva (commenti DSH e altre tabelle Codex conservati).
#
# Perche' REJECT: i revisori hanno trovato residui nel MERGE e negli STATI, non nel
# risultato principale:
#   1. cordis: il merge a testo sostituisce l'intero blocco di primo livello, quindi
#      perde le voci sorelle dello stesso `insert` e i commenti FRA i blocchi; non
#      rimuove un blocco duplicato vecchio (un percorso di un'altra macchina resta
#      mentre --status dice aggiornata).
#   2. --apply dsh ricostruisce la voce e perde env/disabled della voce esistente.
#   3. --status dice "rotta" su un cordis valido con `!!js` (usa safe_load) e
#      "aggiornata" su una voce disabilitata o con serverName sbagliato.
#   4. --apply codex con `[[mcp_servers]]` dice "registrata" mentre il suo stesso
#      --status dice "rotta"; senza tomllib non valida.
#   5. L'interfaccia dichiarata nel criterio (`apply --target`) non esiste: il codice
#      espone `--apply` (documentato in README/piano). Incoerenza del criterio.
#   6. apply cambia i permessi del file (600 -> 664): la scrittura atomica non
#      conserva il modo.
# Residui nel backlog ERR-0061. L'MVP e' raggiunto: il cancello e' raggiungibile dai
# client, che era il fine del contract.
